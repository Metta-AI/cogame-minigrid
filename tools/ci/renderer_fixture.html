<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>minigrid renderer fixture</title>
<style>
  html, body { margin: 0; background: #14120f; color: #f2e8d8;
               font: 12px/1.4 system-ui, sans-serif; }
  #frame { border: 0; display: block; }
  #tx { display: block; }
  #note { padding: 6px 10px; }
</style>
</head>
<body>
<!--
  THE WORST-CASE RENDERER FIXTURE.

  tools/ci/docker_smoke.sh runs with NO ANTHROPIC_API_KEY, so the seat in the
  CI replay plays scripted and emits no `say` at all: the smoke replay can
  never exercise the feed's narration path, the mission ribbon at full cap, or
  the endcard's failure vocabulary (the cogchemists 2026-08-24 scar). Nothing
  that merely plays that replay can draw this chrome.

  So this page LOADS THE SHIPPED dist/static-replay-viewer/index.html IN AN
  IFRAME and shims only the wasm entry's OUTPUT — it does not re-implement the
  drawing (the particle-worlds 2026-08-26 scar). It drives the real page's own
  MinigridChrome.frame()/event() entry points with a worst case:

    * FOUR `say`s at once — one per lane — each filled to exactly MaxSayRunes
      (140) with 4-byte emoji,
    * a mission sentence at full length,
    * a fully fogged board and all five task-pip states across four lanes,
    * an `xland` produce banner and an unlock beat,
    * a failed-by-lava endcard,

  and it ASSERTS THE LAYOUT CONTRACT (addendum v2 §Tests 56) at 1280 px and
  360 px: the mission ribbon, the five task pips, the POV inset, the four
  plates and the feed each have an EMPTY intersection with the board rect,
  none sits inside var(--band), none is clipped by var(--topband), and the pip
  captions do not overlap each other. It also asserts THE SEEK CONTRACT
  (§Tests 52): a click at f in {0, 0.25, 0.5, 0.75, 1.0} seeks to
  first + round(f * span), through the shipped page's own scrubAxis().

  It runs at several canvas widths INCLUDING 360 px, then transcribes every DOM text
  run the real page produced onto a canvas at its measured geometry, so
  `viewer_smoke.mjs --strict-text-bounds` has something to measure (the page's
  own board pixels are drawn in a Worker on an OffscreenCanvas, where the
  harness's canvas_text instrumentation sees nothing).
-->
<div id="note">minigrid renderer fixture — driving the shipped chrome</div>
<iframe id="frame" width="960" height="540" src="./index.html"></iframe>
<canvas id="tx" width="960" height="540"></canvas>
<script>
(function () {
  'use strict';

  var WIDTHS = [1280, 640, 360];
  var LANES = 4;
  var COLOURS = ['red', 'blue', 'green', 'yellow'];
  var ALIASES = ['Alpha', 'Beta', 'Gamma', 'Delta'];
  var SAY = (function () {
    // Exactly 140 runes, with 4-byte emoji sitting on the boundary. The base
    // sentence is 130 runes, so it is REPEATED before the slice: slicing 138
    // out of 130 shipped a 132-rune "worst case" that was 8 runes short of the
    // cap, which is exactly what the full-length assertion below now catches.
    var base = 'I have the yellow key; opening the door at (6,3) and heading east for the green goal square before the lava column closes the gap ';
    var runes = Array.from(base);
    while (runes.length < 138) runes = runes.concat(Array.from(base));
    return runes.slice(0, 138).join('') + '\uD83E\uDDE9\uD83D\uDD11';
  })();
  var MISSION = 'put the red ball next to the blue box, then use the yellow key to open the door and get to the green goal square';

  function pips() {
    var states = ['solved', 'failed', 'current', 'pending', 'unreached'];
    var fams = ['lavagap', 'doorkey', 'multiroom', 'keycorridor', 'babyai'];
    return states.map(function (state, i) {
      // Every quadrant state, in every pip: each lane gets a different one.
      var lanes = [];
      for (var q = 0; q < LANES; q++) lanes.push(states[(i + q) % states.length]);
      return { i: i, family: fams[i], mission: MISSION, current: i === 2,
               lanes: lanes, turns: [6, 5, 4, 3], credits: [3, 2, 1, 0] };
    });
  }

  function laneStates() {
    var view = ['???????', '??###??', '?#~G~#?', '?#kob#?', '?##L##?',
                '?......', '...A...'];
    var out = [];
    for (var s = 0; s < LANES; s++) {
      out.push({
        s: s, alias: ALIASES[s], colour: COLOURS[s],
        solved: 3 - s, score: 312180 - s * 100000, credits: 12 - s * 3,
        seen: 97 - s * 9, turn: 4 + s, resolved: s === 3,
        outcome: s === 3 ? 'timeout' : 'pending',
        dir: ['east', 'south', 'west', 'north'][s],
        carrying: s % 2 === 0 ? 'yellow key' : '',
        fallbacks: 2 - (s % 2), deaths: s % 2, crashes: s % 2,
        doors: 4 - s, picked: 3 - s, productions: 2, view: view
      });
    }
    return out;
  }

  function worstState(tick) {
    var teams = {};
    var roster = [];
    var overTeams = {};
    for (var s = 0; s < LANES; s++) {
      teams[COLOURS[s]] = { lives: 12 - s * 3, prog: 3 - s, held: 3 - s,
                            cov: 312180 - s * 100000, own: false,
                            tags: 97 - s * 9, cogs: 1, flag: 'home',
                            carrier: -1 };
      overTeams[COLOURS[s]] = { lives: 12 - s * 3, prog: 3 - s };
      roster.push({ s: s, name: ['minigrid-missionfirst',
                                 'minigrid-cartographer', 'Baseline (3)',
                                 'Baseline (4)'][s],
                    alias: ALIASES[s], team: COLOURS[s],
                    policy: ['missionfirst', 'cartographer', 'scout',
                             'bumper'][s],
                    kind: s < 2 ? 'llm' : 'scripted',
                    alive: true, lives: 1, carry: s % 2 === 0 });
    }
    return {
      t: tick, mt: 720, mx: 720, st: 0, sp: 1, pl: true, lp: true,
      sk: false, ff: false, en: true, mm: -1, bs: 1, pov: -1,
      ph: tick > 600 ? 'gameover' : 'playing',
      lob: 0, regime: 'gauntlet', game: 1, games: 1, turnTicks: 24,
      teams: teams,
      roster: roster,
      mg: {
        index: 2, count: 5, family: 'xland', mission: MISSION,
        turn: 4, cap: 6, turnsPlayed: 14, maxTurns: 30, maxTicks: 720,
        cells: 169, grid: 13, pips: pips(), lanes: laneStates(), pov: 0
      },
      over: tick > 600 ? {
        winner: 'red', draw: false, timeLimit: false,
        teams: overTeams,
        endRule: 'allLanesComplete', reason: 'complete',
        game: 1, games: 1, regime: 'gauntlet', par: 3, of: 5
      } : undefined,
      beats: [
        { k: 'taskstart', t: 10, s: -1, i: 0, of: 5, family: 'lavagap',
          mission: MISSION, cap: 6 },
        { k: 'unlock', t: 120, s: 0, color: 'yellow', key: 'yellow', x: 6, y: 3 },
        { k: 'produce', t: 240, s: 1, a: 'red key', b: 'blue ball',
          out: 'purple box', x: 5, y: 5 },
        { k: 'solved', t: 300, s: 2, i: 1, turns: 5, ticks: 41 },
        { k: 'failed', t: 420, s: 3, i: 2, why: 'died' },
        { k: 'fallback', t: 500, s: 1, i: 30, cause: 'transport_timeout' },
        { k: 'end', t: 640, s: -1, solved: 3, of: 5, score: 312180,
          reason: 'complete', endRule: 'allLanesComplete' }
      ],
      lulls: [[120, 200], [300, 360]],
      events: []
    };
  }

  var EVENTS = [
    { k: 'taskstart', t: 10, s: -1, i: 0, of: 5, family: 'lavagap',
      mission: MISSION, cap: 6 },
    { k: 'plan', t: 12, s: 0, n: 3,
      verbs: 'goto toggle forward forward forward forward forward right',
      truncated: true, dropped: 2 },
    { k: 'pickup', t: 20, s: 1, type: 'key', color: 'yellow', x: 2, y: 9 },
    { k: 'unlock', t: 22, s: 0, color: 'yellow', key: 'yellow', x: 6, y: 3 },
    { k: 'produce', t: 24, s: 3, a: 'red key', b: 'blue ball',
      out: 'purple box', x: 5, y: 5 },
    { k: 'subgoal', t: 26, s: 1, i: 0, which: 1, label: 'door_open' },
    { k: 'lava', t: 30, s: 2, i: 0, x: 4, y: 4 },
    { k: 'failed', t: 31, s: 2, i: 0, why: 'died' },
    { k: 'fallback', t: 33, s: 1, i: 4, cause: 'transport_timeout' },
    { k: 'solved', t: 40, s: 0, i: 1, turns: 5, ticks: 41 },
    { k: 'budget', t: 41, s: -1, turn: 27, remaining_s: 42 },
    // FOUR full-cap says AT ONCE, one per lane, driven LAST on purpose: the
    // shipped feed keeps a bounded number of rows and `say` is the one kind
    // that may never be dropped, so all four must come back out of the DOM.
    { k: 'say', t: 12, s: 0, text: SAY },
    { k: 'say', t: 12, s: 1, text: SAY },
    { k: 'say', t: 12, s: 2, text: SAY },
    { k: 'say', t: 12, s: 3, text: SAY }
  ];

  // The fixture's own strings must come out of the shipped chrome UNSHORTENED.
  // Without this, a game block that quietly trimmed a remark before writing it
  // into a feed row would transcribe the short string, measure it, and pass —
  // leaving the fixture green while testing nothing (checklist item 15's last
  // bullet). Nothing here shrinks a string: it reads the transcribed runs back.
  function assertFullLength(runs, width) {
    [['the 140-rune say', SAY], ['the mission sentence', MISSION]]
      .forEach(function (entry) {
        var label = entry[0], want = entry[1];
        var carried = runs.some(function (text) { return text.indexOf(want) >= 0; });
        if (carried) return;
        var longest = runs.reduce(
          function (a, b) { return b.length > a.length ? b : a; }, '');
        throw new Error(label + ' came out of the shipped chrome shortened at ' +
          width + 'px: wanted ' + Array.from(want).length +
          ' runes, longest transcribed run was ' + Array.from(longest).length +
          ' runes');
      });
  }

  // ------------------------------------------------------------------
  //  THE LAYOUT CONTRACT (§Tests 56). Nothing this game adds may intersect
  //  the board rect, sit inside var(--band) or be clipped by var(--topband),
  //  and the five pip captions may not overlap each other.
  // ------------------------------------------------------------------
  function rectOf(node) {
    var box = node.getBoundingClientRect();
    return { left: box.left, top: box.top, right: box.right,
             bottom: box.bottom, width: box.width, height: box.height };
  }

  // TOLERANCE. relayout() rounds the board height to whole pixels and
  // reserves each band by its measured offsetHeight, so an inherited band
  // element can share a rounded pixel row with the board edge. Two pixels
  // absorbs that; anything genuinely sitting OVER the board is orders of
  // magnitude past it.
  var EDGE = 2;
  function intersects(a, b) {
    return a.left < b.right - EDGE && b.left < a.right - EDGE &&
           a.top < b.bottom - EDGE && b.top < a.bottom - EDGE;
  }

  function assertLayout(win, doc, width) {
    var board = doc.getElementById('board');
    var stage = doc.getElementById('stage');
    if (!board || !stage) throw new Error('the shipped page has no board');
    var boardRect = rectOf(board);
    var stageRect = rectOf(stage);
    var root = doc.documentElement;
    var band = parseFloat(
      win.getComputedStyle(root).getPropertyValue('--band')) || 0;
    var topBand = parseFloat(
      win.getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var bandRect = { left: stageRect.left, right: stageRect.right,
                     top: stageRect.bottom - band, bottom: stageRect.bottom };
    var named = [['the mission ribbon', '#mg-ribbon'],
                 ['the task pips', '#mg-pips'],
                 ['the POV inset', '#fpv'],
                 ['the feed', '#mg-feed']];
    for (var i = 0; i < LANES; i++) {
      named.push(['the ' + ALIASES[i] + ' plate',
                  '.plate[data-team="' + COLOURS[i] + '"]']);
    }
    named.forEach(function (entry) {
      var node = doc.querySelector(entry[1]);
      if (!node) throw new Error(entry[0] + ' (' + entry[1] +
        ') is not in the shipped page at ' + width + 'px');
      if (win.getComputedStyle(node).display === 'none') return;
      var box = rectOf(node);
      if (box.width < 1 || box.height < 1) return;
      if (intersects(box, boardRect)) {
        throw new Error(entry[0] + ' overlaps the board at ' + width +
          'px: [' + Math.round(box.left) + ',' + Math.round(box.top) + ',' +
          Math.round(box.right) + ',' + Math.round(box.bottom) +
          '] vs board [' + Math.round(boardRect.left) + ',' +
          Math.round(boardRect.top) + ',' + Math.round(boardRect.right) +
          ',' + Math.round(boardRect.bottom) + ']');
      }
      if (band > 0 && intersects(box, bandRect)) {
        throw new Error(entry[0] + ' sits inside the transport band at ' +
          width + 'px');
      }
      if (box.top < stageRect.top + topBand - EDGE &&
          entry[1].indexOf('.plate') < 0) {
        throw new Error(entry[0] + ' is clipped by the top band at ' + width +
          'px (top ' + Math.round(box.top) + ' < ' +
          Math.round(stageRect.top + topBand) + ')');
      }
    });
    // the five pip captions do not overlap each other
    var caps = doc.querySelectorAll('#mg-pips .mg-fam');
    for (var a = 0; a < caps.length; a++) {
      for (var b = a + 1; b < caps.length; b++) {
        if (intersects(rectOf(caps[a]), rectOf(caps[b]))) {
          throw new Error('the pip captions overlap at ' + width + 'px');
        }
      }
    }
    if (caps.length !== 5) {
      throw new Error('the pip stack drew ' + caps.length +
        ' captions, not five, at ' + width + 'px');
    }
  }

  // ------------------------------------------------------------------
  //  THE SEEK CONTRACT (§Tests 52). ONE axis: a click at fraction f seeks to
  //  first + round(f * span), so f = 1.0 lands on the LAST tick — which is
  //  what v1 got wrong (a click at 100 % landed at tick 158 of 315).
  // ------------------------------------------------------------------
  function assertSeek(win, ctx, state, width) {
    if (!win.MinigridChrome.seekFraction) {
      throw new Error('the shipped chrome exposes no seekFraction');
    }
    var axis = win.MinigridChrome.scrubAxis(state);
    if (axis.span !== state.mx - state.st) {
      throw new Error('scrubAxis span is ' + axis.span + ', not ' +
        (state.mx - state.st));
    }
    var sent = [];
    var realSend = ctx.send;
    ctx.send = function (cmd) { sent.push(cmd); };
    try {
      [0, 0.25, 0.5, 0.75, 1.0].forEach(function (f) {
        sent.length = 0;
        win.MinigridChrome.seekFraction(f);
        var want = 's:' + (axis.first + Math.round(f * axis.span));
        if (sent.length !== 1 || sent[0] !== want) {
          throw new Error('a click at ' + (f * 100) + '% sent ' +
            JSON.stringify(sent) + ', wanted ' + want + ' at ' + width + 'px');
        }
      });
    } finally {
      ctx.send = realSend;
    }
  }

  // ------------------------------------------------------------------
  //  THE FEED (§Tests 54). Every fed kind draws one row, `say` is never
  //  dropped, rows carry their lane colour, and NO row carries a real policy
  //  name — the feed speaks in aliases only.
  // ------------------------------------------------------------------
  function assertFeed(doc, width) {
    var rows = doc.querySelectorAll('#killfeed .feed-row');
    if (!rows.length) {
      throw new Error('the shipped feed drew no rows at ' + width + 'px');
    }
    var says = 0;
    var laneTinted = 0;
    for (var i = 0; i < rows.length; i++) {
      var text = rows[i].textContent || '';
      ['minigrid-missionfirst', 'minigrid-cartographer', 'missionfirst',
       'cartographer', 'Baseline ('].forEach(function (name) {
        if (text.indexOf(name) >= 0) {
          throw new Error('a feed row carries the REAL policy name ' + name +
            ' at ' + width + 'px: ' + text.slice(0, 80));
        }
      });
      if (rows[i].querySelector('.mg-say') && text.indexOf('PHASE') < 0) says++;
      for (var q = 0; q < LANES; q++) {
        if (rows[i].classList.contains('lane' + q)) laneTinted++;
      }
    }
    if (says < 1) {
      throw new Error('no `say` row survived the feed queue at ' + width +
        'px — say rows are never dropped');
    }
    if (laneTinted < 1) {
      throw new Error('no feed row carried a lane colour at ' + width + 'px');
    }
  }

  function fail(message) {
    document.documentElement.setAttribute('data-replay-error', message);
    var note = document.getElementById('note');
    if (note) note.textContent = 'FIXTURE FAILED: ' + message;
  }

  // Wrap `text` the way the DOM wraps it inside `width`, so a run the shipped
  // page lays out over several lines is transcribed as a block instead of as
  // one impossible line. Single-line runs (white-space: nowrap — every label
  // and nameplate here) keep the one-line treatment, which is where a string
  // with nowhere to go still shows up as a draw outside the canvas.
  function wrapText(ctx, text, width) {
    var words = text.split(/\s+/);
    var lines = [];
    var line = '';
    for (var i = 0; i < words.length; i++) {
      if (!words[i]) continue;
      var next = line ? line + ' ' + words[i] : words[i];
      if (line && ctx.measureText(next).width > width) {
        lines.push(line);
        line = words[i];
      } else {
        line = next;
      }
    }
    if (line) lines.push(line);
    return lines.length ? lines : [text];
  }

  // Transcribe the real page's DOM text runs onto our canvas at their measured
  // geometry, so --strict-text-bounds measures the SHIPPED strings.
  function transcribe(doc, canvas, runs) {
    var ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    var selectors = ['#mg-ribbon .mg-taskline', '#mg-ribbon .mg-mission',
                     '#clock-time', '#clock-caption', '#fpv-name', '#fpv-cap',
                     '#ec-headline', '#ec-how', '#ec-wincond',
                     '.plate-name', '.mg-carry', '.mg-alias',
                     '#killfeed .feed-row', '.mg-pip .mg-fam', '#tick-clock'];
    var drawn = 0;
    selectors.forEach(function (selector) {
      var nodes = doc.querySelectorAll(selector);
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var text = (node.textContent || '').trim();
        if (!text) continue;
        var box = node.getBoundingClientRect();
        // A node the shipped layout HID draws nothing, so it must not be
        // transcribed: measuring it would put a string at the canvas origin
        // that the page never painted.
        if (box.width < 1 || box.height < 1) continue;
        var style = doc.defaultView.getComputedStyle(node);
        var size = parseFloat(style.fontSize) || 12;
        ctx.font = size + 'px ' + (style.fontFamily || 'sans-serif');
        ctx.fillStyle = '#f2e8d8';
        ctx.textBaseline = 'top';
        // Clamp into the canvas the way the shipped layout clamps into the
        // board: a run that cannot fit is what --strict-text-bounds is for.
        var x = Math.max(0, Math.min(canvas.width - 4, box.left));
        var white = String(style.whiteSpace || '');
        var wraps = white.indexOf('nowrap') < 0 && white.indexOf('pre') !== 0;
        var lines = wraps
          ? wrapText(ctx, text, Math.max(24, Math.min(box.width || canvas.width,
                                                      canvas.width - x)))
          : [text];
        var lineHeight = size * 1.3;
        // The node's OWN box is the room the shipped layout gave this run, so
        // never transcribe more lines than it holds: the page clips its feed
        // column, and re-wrapping at a slightly different font must not
        // invent overflow the browser never drew.
        var maxLines = Math.max(1,
          Math.floor(((box.height || lineHeight) + 1) / lineHeight));
        if (lines.length > maxLines) lines = lines.slice(0, maxLines);
        var block = lineHeight * lines.length;
        var y = Math.max(0, Math.min(canvas.height - block - 2, box.top));
        for (var line = 0; line < lines.length; line++) {
          ctx.fillText(lines[line], x, y + line * lineHeight);
        }
        runs.push(text);
        drawn++;
      }
    });
    return drawn;
  }

  var frame = document.getElementById('frame');
  var canvas = document.getElementById('tx');
  var deadline = Date.now() + 60000;
  // ONE run, ever. Both the iframe's `load` and the belt-and-braces timer call
  // drive(), and a second run entering while the first is mid-loop resizes the
  // iframe under it — every measured box then reads 0 and every transcribed
  // run lands at the canvas origin, which looks exactly like a layout defect.
  var driving = false;

  function drive() {
    if (driving) return;
    var win, doc;
    try {
      win = frame.contentWindow;
      doc = frame.contentDocument;
    } catch (e) {
      fail('cannot reach the shipped page: ' + e.message);
      return;
    }
    if (!win || !doc || !win.MinigridChrome || !win.MG_CTX) {
      if (Date.now() > deadline) {
        fail('the shipped page never exposed MinigridChrome');
        return;
      }
      setTimeout(drive, 200);
      return;
    }
    driving = true;
    var total = 0;

    // ONE WIDTH PER TURN OF THE EVENT LOOP. Resizing the iframe does not
    // re-lay-out its document synchronously: measuring straight after the
    // assignment reads every box as 0, which silently turns every geometry
    // assertion into a comparison of zeros (and transcribes every string at
    // the canvas origin). Let the iframe settle first, then measure.
    function runWidth(index) {
      if (index >= WIDTHS.length) {
        if (total === 0) {
          fail('the shipped chrome produced no text to measure');
          return;
        }
        document.getElementById('note').textContent =
          'minigrid renderer fixture — ' + total +
          ' shipped text runs measured at ' + WIDTHS.join('/') + ' px';
        document.documentElement.setAttribute('data-replay-loaded', 'true');
        return;
      }
      var width = WIDTHS[index];
      frame.width = String(width);
      frame.height = String(Math.round(width * 0.5625));
      canvas.width = width;
      canvas.height = Math.round(width * 0.5625);
      if (typeof win.dispatchEvent === 'function') {
        win.dispatchEvent(new win.Event('resize'));
      }
      setTimeout(function () {
        try {
          measureWidth(width);
        } catch (e) {
          fail(e.message);
          return;
        }
        runWidth(index + 1);
      }, 300);
    }

    function measureWidth(width) {
      // The shipped page publishes its own chrome context as MG_CTX, so
      // this fixture drives the REAL chrome through the REAL context.
      var ctx = win.MG_CTX;
      if (!ctx) throw new Error('the shipped page published no chrome context');
      [400, 640].forEach(function (tick) {
        var state = worstState(tick);
        // The WHOLE shipped frame path, in production order: the inherited
        // scorebug/clock/transport render, then the events, then the game
        // block's own frame. Driving the block alone would leave the four
        // plates unbuilt and the layout contract untested.
        if (ctx.onFrame) {
          try { ctx.onFrame(JSON.stringify(state)); }
          catch (e) { throw new Error('onFrame: ' + e.message); }
        }
        EVENTS.forEach(function (event) {
          try { win.MinigridChrome.event(event, state, ctx); }
          catch (e) { throw new Error('event ' + event.k + ': ' + e.message); }
        });
        try { win.MinigridChrome.frame(state, ctx, false); }
        catch (e) { throw new Error('frame: ' + e.message); }
      });
      // The 7x7 agent-view inset is a REQUIRED spectator readout, and the
      // inherited renderFpv() reveals #fpv only for a paintball POV seat — a
      // key this fork never sends, which left the panel computed every frame
      // and never displayed (review r1, N1). Probe the SHIPPED page's computed
      // style, at every width, so a regression back to display:none is red
      // here instead of invisible.
      var fpv = doc.getElementById('fpv');
      if (!fpv) throw new Error('the shipped page has no #fpv panel');
      if (win.getComputedStyle(fpv).display === 'none') {
        throw new Error('#fpv (the agent view 7x7 inset) is display:none at ' +
                        width + 'px after a frame that carries a view');
      }
      // The POV badge comes BACK with four lanes: there is something to
      // select now.
      var badge = doc.getElementById('povBadge');
      if (!badge) throw new Error('the shipped page has no #povBadge');
      assertLayout(win, doc, width);
      assertSeek(win, ctx, worstState(400), width);
      assertFeed(doc, width);
